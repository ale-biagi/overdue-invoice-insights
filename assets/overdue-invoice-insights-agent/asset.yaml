apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: overdue-invoice-insights-agent
  version: "1.0.0"

provides:
  apis:
    - name: overdue-invoice-insights-agent
      kind: a2a
      ordId: customer.build:apiResource:overdue-invoice-insights-1385a.overdue-invoice-insights-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-cadunning-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:overdue-invoice-insights-1385a.sap-s4-cadunning-mcp-server:v1
  - name: sap-s4-credit-management-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:overdue-invoice-insights-1385a.sap-s4-credit-management-mcp-server:v1
  - name: sap-s4-dispute-case-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:overdue-invoice-insights-1385a.sap-s4-dispute-case-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
